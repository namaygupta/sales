name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps && npm install react-is --legacy-peer-deps

      - name: Build
        run: npx vite build
        env:
          VITE_PASSWORD: "MarcusAurelius$1806"
          VITE_SUPABASE_URL: "https://lxukabtecfavgcfuyfed.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4dWthYnRlY2ZhdmdjZnV5ZmVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NzQzNjAsImV4cCI6MjEwOTE1MDM2MH0.OdiMiMiIkjWHHB_aDw_dQEtJ68aOqnFstCVFjmpo2Kw"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
